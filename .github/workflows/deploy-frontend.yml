name: Deploy Frontend (Railway)

# Deploys the Next.js frontend to the Railway service "sellary-frontend".
# (Netlify was retired 2026-07-25: account credits exhausted, deploys blocked.)
# Requires one repo secret: RAILWAY_TOKEN (Railway dashboard → Tokens).
#
# Runs only after CI goes green on main. `workflow_run` carries no `paths`
# filter, so this fires on every green main build rather than only on frontend
# changes — a redundant deploy is cheap, shipping on a red build is not.
#
# Manual alternative from a workstation with the Railway CLI linked:
#   cd sellary-frontend && railway up --service sellary-frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A manual dispatch is a deliberate act and deploys regardless; an automatic
    # run ships only what CI proved.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip by default; pin to the
          # commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Check Railway secret
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN not set — skipping deploy. Add it in Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Railway
        if: steps.check.outputs.ok == 'true'
        working-directory: sellary-frontend
        # No --detach: with it the step went green the moment the upload
        # finished, so a failed Railway build left GitHub green and nobody knew.
        #
        # But `up --ci` also exits non-zero when it merely loses the build-log
        # stream ("Failed to stream build logs"), and that has already marked a
        # deployment red that Railway had in fact shipped. So a non-zero exit
        # is treated as a question, not an answer: ask Railway what the latest
        # deployment actually did, and fail only if it is not SUCCESS.
        timeout-minutes: 20
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          npx --yes @railway/cli@4 up --service sellary-frontend --ci
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          echo "::warning::railway up exited $code — checking what the deployment actually did"
          # Railway may still be building; give it the same window the CLI had.
          for attempt in $(seq 1 40); do
            status=$(npx --yes @railway/cli@4 deployment list --service sellary-frontend 2>/dev/null \
              | grep -oE '\| (SUCCESS|FAILED|CRASHED|BUILDING|DEPLOYING|INITIALIZING|QUEUED|REMOVED) \|' \
              | head -1 | tr -d '| ')
            echo "latest deployment: ${status:-unknown} (attempt $attempt)"
            case "$status" in
              SUCCESS) echo "::notice::Deployment succeeded; the CLI only lost the log stream."; exit 0 ;;
              FAILED|CRASHED) echo "::error::Railway build ${status}."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Could not confirm the deployment status within the window."
          exit 1
