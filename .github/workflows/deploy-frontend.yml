name: Deploy Frontend (Railway)

# Deploys the Next.js frontend to the Railway service "sellary-frontend" on
# every push to main. (Netlify was retired 2026-07-25: account credits
# exhausted, deploys blocked.) Requires one repo secret: RAILWAY_TOKEN
# (Railway dashboard → Account/Project → Tokens). Until it is set the job
# succeeds with a notice (no deploy), so it never blocks with a red X.
#
# Manual alternative from a workstation with the Railway CLI linked:
#   cd sellary-frontend && railway up --service sellary-frontend

on:
  push:
    branches: [main]
    paths:
      - 'sellary-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway secret
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN not set — skipping deploy. Add it in Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Railway
        if: steps.check.outputs.ok == 'true'
        working-directory: sellary-frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx --yes @railway/cli@4 up --service sellary-frontend --detach
