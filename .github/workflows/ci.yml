name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sellary-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall api core models repositories schemas services main.py
      - name: Check module registry parity
        run: python ../scripts/check_module_parity.py
      - name: Check migration pin
        run: python ../scripts/check_migration_pin.py
      - name: Tests
        # The suite runs against in-memory SQLite, so no service container is
        # needed — but Settings defaults SELLARY_ENV to "production", which
        # hard-crashes on a weak SECRET_KEY before conftest can even import.
        # CI is not production: name it, and hand it a throwaway key so the
        # length check passes without a real secret in the repo.
        env:
          SELLARY_ENV: test
          SECRET_KEY: ci-only-not-a-real-secret-0000000000000000000000000000000000
        # --durations names the slowest tests instead of leaving an opaque step;
        # timeout-minutes turns a hang into a fast red. The suite runs in ~35s on
        # this runner, so 10 minutes is a wide margin, not a tight budget.
        timeout-minutes: 10
        run: pytest tests/integration tests/unit -q -p no:cacheprovider --durations=15

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sellary-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sellary-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  cashier:
    name: Tauri Cashier
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sellary-cashier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sellary-cashier/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Tauri build
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build
