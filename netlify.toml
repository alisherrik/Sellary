# publish is resolved RELATIVE TO base by current netlify-cli 17.x (this
# changed within the 17.x line — an absolute-style repo path doubles to
# sellary-frontend/sellary-frontend/.next and the deploy fails).
[build]
base = "sellary-frontend"
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NEXT_PUBLIC_API_URL = "/api"
NEXT_PUBLIC_API_PROXY_TARGET = "https://sellary-production-30ec.up.railway.app"

[[plugins]]
package = "@netlify/plugin-nextjs"
